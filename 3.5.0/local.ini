; CouchDB Configuration Settings

; Custom settings should be made in this file. They will override settings
; in default.ini, but unlike changes made to default.ini, this file won't be
; overwritten on server upgrade.

[chttpd]
bind_address = any

[httpd]
bind_address = any
enable_cors = true
max_http_request_size = 1073741824

[log]
writer = file
file = /opt/couchdb/var/log/couch.log


[couchdb]
; If you use single-node deployments, this prevents the setup wizard prompt
single_node = true
; 3.x will generate a uuid if omitted; keep explicit if you want
; uuid = auto

[admins]
; You MUST define an admin in 3.x (no admin-party). Override via env in entrypoint.
; admin = password

[cors]
origins = *
methods = GET, PUT, POST, HEAD, DELETE
credentials = true
headers = accept, authorization, content-type, origin, referer, x-csrf-token

[couch_httpd_auth]
; 3.x ships stricter auth; tweak if you relied on lenient defaults before
timeout = 2400
